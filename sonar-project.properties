# SonarQube Cloud analysis, run by .github/workflows/sonar.yml.
sonar.organization=dopbase
sonar.projectKey=dopbasehq_node-sdk
sonar.projectName=Dopbase Node SDK
sonar.sourceEncoding=UTF-8

# SonarQube Cloud analyses the whole repository, so the scope is set with
# exclusions only. Left out:
# - the unit tests and their helpers
# - the runtime smoke tests, which only run against a built package
# - build output, coverage reports and dependencies
sonar.exclusions=\
  tests/**,\
  **/*.test.ts,\
  scripts/smoke/**,\
  scripts/smoke.mjs,\
  dist/**,\
  coverage/**,\
  node_modules/**

# Type-aware TypeScript rules read the project's tsconfig.
sonar.typescript.tsconfigPaths=tsconfig.json

# Coverage from `npm run test:coverage`, which the workflow runs before the
# scan. Only the SDK in src/ is measured: type declarations have no code to
# cover, and the build scripts and config files aren't unit tested.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
  src/**/*.d.ts,\
  scripts/**,\
  *.config.ts

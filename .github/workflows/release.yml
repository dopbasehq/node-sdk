name: Release

# Pushing a version tag publishes that version to npm and opens a GitHub
# release with its changelog entry. Tags are the bare version with no "v",
# matching package.json and .npmrc (tag-version-prefix=""):
#
#   npm version 0.2.0         # bumps package.json and creates the tag 0.2.0
#   git push --follow-tags
#
# A prerelease such as 0.2.0-beta.1 goes out under the npm dist-tag "beta", so
# `npm install @dopbase/sdk` keeps getting the last stable version.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  npm:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # npm trusted publishing and provenance both sign in with the job's
      # GitHub OIDC token.
      id-token: write
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check tag, version and changelog
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points at a commit that is not on main."
            exit 1
          fi

          if ! grep -qE "^## ${version//./\\.}( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section."
            exit 1
          fi

          case "$version" in
            *-*)
              # 0.2.0-beta.1 -> beta, 1.0.0-rc.2 -> rc
              dist_tag=$(echo "${version#*-}" | sed -E 's/[.0-9]+$//')
              [ -n "$dist_tag" ] || dist_tag=next
              prerelease=true
              ;;
            *)
              dist_tag=latest
              prerelease=false
              ;;
          esac
          {
            echo "version=$version"
            echo "dist_tag=$dist_tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already on npm
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@dopbase/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@dopbase/sdk@$VERSION is already on npm. Skipping publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.published.outputs.exists == 'false'
        run: npm ci --ignore-scripts

      # prepublishOnly runs the typecheck, the tests and the build first.
      - name: Publish
        if: steps.published.outputs.exists == 'false'
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          # Only used when npm trusted publishing is not set up for the
          # package. With trusted publishing npm signs in through OIDC and
          # this secret can be deleted. The trusted publisher must allow
          # `npm publish`, not only `npm stage publish`. npm stops accepting
          # 2FA-bypass tokens for direct publishing in January 2027.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

  github:
    name: GitHub release
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.npm.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists."
            exit 0
          fi

          # The changelog section for this version, without its heading.
          awk -v v="$TAG" '
            index($0, "## " v " ") == 1 || $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file notes.md "${flags[@]}"

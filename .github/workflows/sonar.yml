name: Sonar

# SonarQube Cloud analysis. It lives apart from ci.yml so a Sonar outage or a
# failed quality gate never fails the CI check. The project and the analysis
# scope are set in sonar-project.properties.
#
# Pull requests are scanned as pull requests, and main is scanned as a branch
# after a merge. Run the workflow by hand to scan a branch that has no pull
# request. Changes that only touch Markdown are skipped.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: SonarQube Cloud scan
    # GitHub keeps SONAR_TOKEN from a pull request opened from a fork, so the
    # scan can't run there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Sonar reads the whole history for blame and to tell new code from old.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The TypeScript analysis resolves types from node_modules. Nothing is
      # built or run from them, so install scripts stay off.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
